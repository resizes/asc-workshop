apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      containers:
      - name: vllm
        image: public.ecr.aws/q9t5s3a7/vllm-arm64-cpu-release-repo:latest
        command: ["/bin/sh", "-c"]
        args:
        - "vllm serve meta-llama/Llama-3.2-1B-Instruct --dtype float16 --max-model-len 1024 --gpu-memory-utilization 0.4"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 12Gi
        volumeMounts:
        - name: model-storage
          mountPath: /root/.cache/huggingface
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 360
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: vllm-models
