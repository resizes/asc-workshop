apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llmops
data:
  config.yaml: |
    model_list:
      - model_name: llama-3-2-1b-local
        litellm_params:
          model: ollama/llama3.2:1b
          api_base: http://ollama.llmops.svc.cluster.local:11434

      - model_name: qwen-coder-local
        litellm_params:
          model: ollama/qwen2.5-coder:1.5b
          api_base: http://ollama.llmops.svc.cluster.local:11434

      # Bedrock via IRSA — Mistral Devstral 2 123B Instruct (Devstral-2-123B-Instruct-2512).
      # If invocation fails, confirm the foundation model ID for eu-west-1 matches LiteLLM’s bedrock/… string (AWS docs).
      - model_name: devstral-2-123b-instruct-bedrock
        litellm_params:
          model: bedrock/mistral.devstral-2-123b
          aws_region_name: eu-west-1

      # Optional: uncomment after creating secret `ollama-cloud` (see WORKSHOP.md Part B).
      # - model_name: ollama-cloud-example
      #   litellm_params:
      #     model: ollama/YOUR_CLOUD_MODEL
      #     api_base: https://ollama.com
      #     api_key: os.environ/OLLAMA_API_KEY
