apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llmops
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      containers:
        - name: litellm
          image: docker.litellm.ai/berriai/litellm:main-stable
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          env:
            - name: AWS_REGION
              value: eu-west-1
            - name: AWS_DEFAULT_REGION
              value: eu-west-1
          envFrom:
            - secretRef:
                name: litellm-secrets
            - secretRef:
                name: ollama-cloud
                optional: true
          volumeMounts:
            - name: cfg
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: cfg
          configMap:
            name: litellm-config
