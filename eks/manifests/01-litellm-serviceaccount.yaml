# LiteLLM uses IRSA for Amazon Bedrock — no long-lived AWS access keys in Secrets.
#
# IAM policy WorkshopBedrockInvoke must exist in the same account as REPLACE_AWS_ACCOUNT_ID
# (workshop org: pre-created). Create an IAM role that trusts THIS cluster’s OIDC issuer for
# system:serviceaccount:llmops:litellm, attach that policy, then substitute the placeholder:
#   export WORKSHOP_AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
#   sed -i '' "s/REPLACE_AWS_ACCOUNT_ID/${WORKSHOP_AWS_ACCOUNT_ID}/g" eks/manifests/01-litellm-serviceaccount.yaml   # macOS
#   sed -i "s/REPLACE_AWS_ACCOUNT_ID/${WORKSHOP_AWS_ACCOUNT_ID}/g" eks/manifests/01-litellm-serviceaccount.yaml         # Linux
# See WORKSHOP.md Part B — Cloud Step 5 (before kubectl apply -k). See also eks/IAM_SETUP.md §3.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: llmops
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_AWS_ACCOUNT_ID:role/litellm-bedrock-eu-west-1
